<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Bridge Escape</title>
  <meta name="description" content="Type long words to build bridges and escape the zombie horde!" />
  <meta property="og:title" content="Word Bridge Escape" />
  <meta property="og:description" content="Type long words to build bridges and escape the zombie horde!" />
  <meta property="og:type" content="website" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a0a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 900px;
      max-width: 100vw;
    }
    #game-canvas {
      display: block;
      width: 100%;
      border: 3px solid #ff6b35;
      border-radius: 8px;
      image-rendering: pixelated;
    }
    #word-input-container {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 10;
      width: 90%;
    }
    #word-input {
      width: 100%;
      max-width: 600px;
      padding: 12px 20px;
      font-size: 22px;
      font-weight: bold;
      border: 4px solid #ff6b35;
      border-radius: 50px;
      background: rgba(10, 5, 20, 0.92);
      color: #fff;
      text-align: center;
      outline: none;
      letter-spacing: 2px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #word-input:focus { box-shadow: 0 0 20px #ff6b3588; }
    #word-input.valid { border-color: #44ff88; box-shadow: 0 0 20px #44ff8888; }
    #word-input.invalid { border-color: #ff3344; box-shadow: 0 0 20px #ff334488; }
    #word-input.loading { border-color: #ffdd44; box-shadow: 0 0 20px #ffdd4488; }
    #submit-btn {
      padding: 10px 32px;
      font-size: 18px;
      font-weight: bold;
      background: #ff6b35;
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.1s;
    }
    #submit-btn:hover { background: #ff8c5a; transform: scale(1.05); }
    #validation-msg {
      color: #ffdd44;
      font-size: 14px;
      font-weight: bold;
      min-height: 20px;
      letter-spacing: 1px;
    }
    #length-bar-container {
      width: 100%;
      max-width: 600px;
      height: 12px;
      background: rgba(255,255,255,0.15);
      border-radius: 6px;
      overflow: hidden;
    }
    #length-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff6b35, #ff3344);
      border-radius: 6px;
      transition: width 0.2s, background 0.2s;
    }
    #length-bar.sufficient { background: linear-gradient(90deg, #44ff88, #00ccff); }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="900" height="500"></canvas>
    <div id="word-input-container">
      <div id="length-bar-container"><div id="length-bar"></div></div>
      <input id="word-input" type="text" placeholder="Type a word..." autocomplete="off" spellcheck="false" />
      <button id="submit-btn">BRIDGE IT!</button>
      <div id="validation-msg"></div>
    </div>
  </div>

  <!-- Error overlay: catches module errors and shows them on screen -->
  <div id="error-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;background:#1a0010;color:#ff4466;font:14px monospace;padding:20px;z-index:9999;white-space:pre-wrap;max-height:50vh;overflow:auto;border-bottom:2px solid #ff4466;"></div>
  <script>
    window.addEventListener('error', function(e) {
      var el = document.getElementById('error-overlay');
      el.style.display = 'block';
      el.textContent += '❌ ' + e.message + '\n   at ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n\n';
    });
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('error-overlay');
      el.style.display = 'block';
      el.textContent += '❌ Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '\n\n';
    });
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
